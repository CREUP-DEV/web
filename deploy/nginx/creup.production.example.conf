map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  listen [::]:80;
  server_name creup.es www.creup.es;

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name creup.es www.creup.es;

  ssl_certificate /etc/letsencrypt/live/creup.es/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/creup.es/privkey.pem;

  # Keep request size above current admin upload limits.
  client_max_body_size 50m;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # Health check: only reachable directly on the VPS, not through the public proxy.
  # The app rejects requests carrying X-Forwarded-For with a 404, so blocking here
  # is defense in depth — but this prevents accidental public exposure.
  location = /health {
    deny all;
  }
}