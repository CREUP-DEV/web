map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream creup_app {
  server 127.0.0.1:3000;
  keepalive 16;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=public:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
limit_req_status 429;

server {
  listen 80;
  listen [::]:80;
  server_name creup.es www.creup.es;

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name creup.es www.creup.es;

  ssl_certificate /etc/letsencrypt/live/creup.es/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/creup.es/privkey.pem;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # Upload cap — must be ≥ app-level hard cap (22 MB)
  client_max_body_size 24m;

  # Strip any incoming X-Forwarded-For the client may have sent, then set it
  # to the real connecting IP so the app can trust it unconditionally.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  # Public pages
  location / {
    limit_req zone=public burst=20 nodelay;
    proxy_pass http://creup_app;
  }

  # API — slightly more permissive burst for legitimate clients
  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://creup_app;
  }

  # Static assets — immutable, no rate limit
  location /_nuxt/ {
    proxy_pass http://creup_app;
    proxy_cache_valid 200 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Image proxy — no rate limit (app enforces its own)
  location /_ipx/ {
    proxy_pass http://creup_app;
  }

  # Health check: only reachable directly on the VPS, not through the public proxy.
  # The app rejects requests carrying X-Forwarded-For with a 404, so blocking here
  # is defense in depth — but this prevents accidental public exposure.
  location = /health {
    deny all;
  }
}
