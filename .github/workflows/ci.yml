name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Must run before setup-node so its `cache: pnpm` can resolve the store.
      # Version is read from package.json#packageManager (pnpm@11.5.1).
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Runs the postinstall `nuxt prepare`, generating .nuxt types for typecheck.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check i18n parity
        run: pnpm i18n:check

      # No env required: nuxt build evaluates config with fallbacks and never
      # touches the DB/Redis (the sitemap's DB-backed sources resolve at runtime,
      # and the startup config assertion is a Nitro runtime plugin, not build).
      - name: Build
        run: pnpm build

      # Boots the artefact just built and asserts the admin API answers 401 without a session. The
      # guard used to be registered in a way Nitro silently ignored, and nothing caught it because
      # the browser still redirected /admin to the login page. Placeholder secrets are enough: the
      # rejection happens before any database or OAuth call, which the unreachable DATABASE_URL
      # here also proves.
      - name: Check admin API rejects anonymous callers
        run: pnpm check:admin-auth
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/ci
          APP_SECRET: ci-placeholder-secret-value-32-chars
          GOOGLE_CLIENT_ID: ci-placeholder-client-id
          GOOGLE_CLIENT_SECRET: ci-placeholder-client-secret
